name: binousfit
description: "Binousfit — Flutter master skeleton (Clean Architecture)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  get_it: ^8.0.2
  fpdart: ^1.1.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dio: ^5.7.0
  retrofit: ">=4.4.1 <4.9.0"
  pretty_dio_logger: ^1.4.0
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.3
  easy_localization: ^3.0.7
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  go_router: ^14.6.2
  skeletonizer: ^1.4.2
  flutter_svg: ^2.0.16
  lottie: ^3.1.3
  logger: ^2.5.0
  connectivity_plus: ^6.1.1
  jwt_decoder: ^2.0.1
  cached_network_image: ^3.4.1
  flutter_native_splash: ^2.4.3
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/
