name: binousfit
description: "Binousfit — Flutter Gym App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

# ─────────────────────────────
# CORE FLUTTER DEPENDENCIES
# ─────────────────────────────
dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8

  # Dependency Injection
  get_it: ^9.2.1

  # Functional Programming
  fpdart: ^1.2.0

  # Networking
  dio: ^5.9.2
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0

  # Models / Serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Routing
  go_router: ^17.2.0

  # UI / UX
  flutter_screenutil: ^5.9.3
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  lottie: ^3.3.3

  # Localization
  easy_localization: ^3.0.8
  intl: ^0.20.2

  # Utilities
  logger: ^2.7.0
  jwt_decoder: ^2.0.1
  url_launcher: ^6.3.2
  # package_info_plus: ^10.0.0

  # Native
  flutter_native_splash: ^2.4.7

# ─────────────────────────────
# DEV DEPENDENCIES
# ─────────────────────────────
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Quality
  very_good_analysis: ^10.2.0

  # Code Generation
  build_runner: ^2.13.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  retrofit_generator: ^10.2.5

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/